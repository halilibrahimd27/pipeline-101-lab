# ---------------------------------------------------------------
#  KARNE — bu dosyaya dokunmana gerek yok.
#
#  Her push'tan sonra calisir ve gorevlerin durumunu
#  Actions > kontrol > Summary ekraninda gosterir.
# ---------------------------------------------------------------

name: kontrol

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  karne:
    name: Karne
    runs-on: ubuntu-latest
    steps:
      # Not: bu satir bilerek dogru yazildi — Gorev 4'te senden
      # istenen sey tam olarak bu. Ornegi burada gorebilirsin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gorevleri kontrol et
        run: python3 .github/scripts/kontrol.py
